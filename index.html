<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>條碼庫存測試</title>


    <!-- 條碼掃描套件 -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;
        }


        body {

            display: flex;
            justify-content: center;
        }


        .app {

            width: 100%;
            max-width: 480px;

            min-height: 100vh;

            padding: 24px 20px;
        }


        /* =====================================
           首頁
        ====================================== */

        .home {

            min-height: calc(100vh - 48px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .scan-button {

            width: 180px;
            height: 180px;

            border-radius: 50%;

            border: 2px solid #111;

            background: #fff;

            color: #111;

            font-size: 22px;

            font-weight: 600;

            cursor: pointer;
        }


        .scan-button:active {

            transform: scale(0.96);
        }


        /* =====================================
           掃描頁
        ====================================== */

        .scanner-page {

            display: none;
        }


        .page-title {

            margin: 10px 0 16px;

            font-size: 24px;

            font-weight: 600;
        }


        /* =====================================
           相機
        ====================================== */

        .camera-wrapper {

            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: 12px;

            background: #000;

            aspect-ratio: 3 / 4;
        }


        #reader {

            width: 100%;
            height: 100%;
        }


        #reader video {

            width: 100% !important;

            height: 100% !important;

            object-fit: cover;

            transition:
                transform 0.2s ease;
        }


        /* =====================================
           CSS Zoom 備援
        ====================================== */

        .zoom-1 {
            transform: scale(1);
        }


        .zoom-2 {
            transform: scale(2);
        }


        .zoom-3 {
            transform: scale(3);
        }


        .zoom-4 {
            transform: scale(4);
        }


        .zoom-5 {
            transform: scale(5);
        }


        /* =====================================
           掃描框
        ====================================== */

        .scan-frame {

            position: absolute;

            top: 50%;
            left: 50%;

            width: 78%;
            height: 25%;

            transform:
                translate(-50%, -50%);

            border: 2px solid #fff;

            border-radius: 8px;

            pointer-events: none;

            z-index: 10;
        }


        .scan-frame::before {

            content: "";

            position: absolute;

            left: 10%;
            right: 10%;

            top: 50%;

            height: 2px;

            background: #fff;

            opacity: 0.8;
        }


        /* =====================================
           Zoom 按鈕
        ====================================== */

        .zoom-title {

            margin-top: 16px;

            margin-bottom: 8px;

            font-size: 14px;

            color: #777;

            text-align: center;
        }


        .zoom-buttons {

            display: flex;

            justify-content: center;

            gap: 8px;

            width: 100%;
        }


        .zoom-button {

            flex: 1;

            height: 42px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #333;

            font-size: 15px;

            cursor: pointer;
        }


        .zoom-button.active {

            background: #111;

            color: #fff;

            border-color: #111;
        }


        .zoom-button:active {

            transform: scale(0.97);
        }


        /* =====================================
           返回
        ====================================== */

        .back-button {

            margin-top: 20px;

            width: 100%;

            height: 48px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            font-size: 16px;

            cursor: pointer;
        }


        /* =====================================
           商品資訊
        ====================================== */

        .result {

            display: none;

            margin-top: 24px;

            padding: 20px;

            border: 1px solid #ddd;

            border-radius: 12px;

            background: #fff;
        }


        .result-title {

            margin: 0 0 18px;

            font-size: 20px;

            font-weight: 600;
        }


        .info-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 10px 0;

            border-bottom: 1px solid #eee;
        }


        .info-row:last-child {

            border-bottom: none;
        }


        .info-label {

            color: #777;
        }


        .info-value {

            font-weight: 500;

            text-align: right;

            word-break: break-all;
        }


        /* =====================================
           新增商品
        ====================================== */

        .add-box {

            display: none;

            margin-top: 24px;

            padding: 20px;

            border: 1px solid #ddd;

            border-radius: 12px;
        }


        .add-title {

            margin: 0 0 8px;

            font-size: 20px;

            font-weight: 600;
        }


        .add-description {

            margin: 0 0 18px;

            color: #777;

            font-size: 14px;
        }


        .input {

            width: 100%;

            height: 46px;

            padding: 0 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            outline: none;
        }


        .input:focus {

            border-color: #111;
        }


        .add-button {

            width: 100%;

            height: 46px;

            border: none;

            border-radius: 7px;

            background: #111;

            color: #fff;

            font-size: 16px;

            cursor: pointer;
        }


        .add-button:active {

            opacity: 0.8;
        }


        /* =====================================
           訊息
        ====================================== */

        .message {

            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 8px;

            background: #f5f5f5;

            color: #333;

            font-size: 14px;

            text-align: center;
        }


        /* =====================================
           Loading
        ====================================== */

        .loading {

            display: none;

            margin-top: 16px;

            text-align: center;

            color: #777;

            font-size: 14px;
        }


    </style>

</head>


<body>


<div class="app">


    <!-- =====================================
         首頁
    ====================================== -->

    <section
        id="homePage"
        class="home"
    >

        <button
            id="scanButton"
            class="scan-button"
            type="button"
        >
            掃描
        </button>

    </section>



    <!-- =====================================
         掃描頁
    ====================================== -->

    <section
        id="scannerPage"
        class="scanner-page"
    >

        <h1 class="page-title">
            掃描條碼
        </h1>


        <!-- 相機 -->

        <div class="camera-wrapper">

            <div id="reader"></div>

            <div class="scan-frame"></div>

        </div>



        <!-- =================================
             Zoom
        ================================== -->

        <div class="zoom-title">
            相機倍率
        </div>


        <div class="zoom-buttons">


            <button
                class="zoom-button active"
                data-zoom="1"
                type="button"
            >
                1x
            </button>


            <button
                class="zoom-button"
                data-zoom="2"
                type="button"
            >
                2x
            </button>


            <button
                class="zoom-button"
                data-zoom="3"
                type="button"
            >
                3x
            </button>


            <button
                class="zoom-button"
                data-zoom="4"
                type="button"
            >
                4x
            </button>


            <button
                class="zoom-button"
                data-zoom="5"
                type="button"
            >
                5x
            </button>


        </div>



        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >
            查詢商品中...
        </div>



        <!-- 訊息 -->

        <div
            id="message"
            class="message">
        </div>



        <!-- =================================
             商品資訊
        ================================== -->

        <div
            id="resultBox"
            class="result"
        >

            <h2 class="result-title">
                商品資訊
            </h2>


            <div class="info-row">

                <span class="info-label">
                    商品名稱
                </span>

                <span
                    id="productName"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    條碼
                </span>

                <span
                    id="productBarcode"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    庫存
                </span>

                <span
                    id="productStock"
                    class="info-value"
                >
                    -
                </span>

            </div>


        </div>



        <!-- =================================
             新增商品
        ================================== -->

        <div
            id="addBox"
            class="add-box"
        >

            <h2 class="add-title">
                找不到商品
            </h2>


            <p class="add-description">
                此條碼尚未建立，可以直接新增。
            </p>


            <input
                id="newBarcode"
                class="input"
                type="text"
                placeholder="條碼"
                readonly
            >


            <input
                id="newProductName"
                class="input"
                type="text"
                placeholder="商品名稱"
            >


            <input
                id="newStock"
                class="input"
                type="number"
                inputmode="numeric"
                placeholder="初始庫存"
                value="0"
            >


            <button
                id="addButton"
                class="add-button"
                type="button"
            >
                新增商品
            </button>


        </div>



        <!-- 返回 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            返回
        </button>


    </section>


</div>



<script>


    // ==========================================
    // Apps Script API
    // ==========================================

    const API_URL =
        "https://script.google.com/macros/s/AKfycbxTcojoeoGFlj2kEZ7xvMpXx2xorQvR3haq3mkZmmlDUUI1l4VSYgBj56KfmTuOYT5z/exec";



    // ==========================================
    // DOM
    // ==========================================

    const homePage =
        document.getElementById("homePage");


    const scannerPage =
        document.getElementById("scannerPage");


    const scanButton =
        document.getElementById("scanButton");


    const backButton =
        document.getElementById("backButton");


    const resultBox =
        document.getElementById("resultBox");


    const addBox =
        document.getElementById("addBox");


    const productName =
        document.getElementById("productName");


    const productBarcode =
        document.getElementById("productBarcode");


    const productStock =
        document.getElementById("productStock");


    const newBarcode =
        document.getElementById("newBarcode");


    const newProductName =
        document.getElementById("newProductName");


    const newStock =
        document.getElementById("newStock");


    const addButton =
        document.getElementById("addButton");


    const message =
        document.getElementById("message");


    const loading =
        document.getElementById("loading");



    // ==========================================
    // Scanner
    // ==========================================

    let html5QrCode = null;

    let scannerRunning = false;

    let scanned = false;


    // ==========================================
    // Camera Track
    // ==========================================

    let cameraTrack = null;

    let nativeZoomSupported = false;

    let currentZoom = 1;



    // ==========================================
    // 開啟掃描
    // ==========================================

    scanButton.addEventListener(
        "click",
        async () => {

            homePage.style.display =
                "none";


            scannerPage.style.display =
                "block";


            resetResult();


            await startScanner();

        }
    );



    // ==========================================
    // 開始相機
    // ==========================================

    async function startScanner() {

        scanned = false;


        try {

            html5QrCode =
                new Html5Qrcode("reader");


            const config = {

                fps: 10,


                qrbox: {

                    width: 280,

                    height: 160

                },


                formatsToSupport: [

                    Html5QrcodeSupportedFormats.CODE_128,

                    Html5QrcodeSupportedFormats.CODE_39,

                    Html5QrcodeSupportedFormats.CODE_93,

                    Html5QrcodeSupportedFormats.EAN_13,

                    Html5QrcodeSupportedFormats.EAN_8,

                    Html5QrcodeSupportedFormats.UPC_A,

                    Html5QrcodeSupportedFormats.UPC_E,

                    Html5QrcodeSupportedFormats.ITF,

                    Html5QrcodeSupportedFormats.CODABAR

                ]

            };


            await html5QrCode.start(

                {
                    facingMode:
                        "environment"
                },

                config,

                onScanSuccess,

                onScanFailure

            );


            scannerRunning = true;


            /*
             * 等待 video 出現
             */

            setTimeout(
                prepareCameraZoom,
                500
            );


        } catch (error) {

            console.error(error);


            showMessage(
                "無法開啟相機，請確認瀏覽器已允許相機權限。"
            );

        }

    }



    // ==========================================
    // 準備 Camera Zoom
    // ==========================================

    async function prepareCameraZoom() {

        try {

            const video =
                document.querySelector(
                    "#reader video"
                );


            if (!video) {

                return;
            }


            const stream =
                video.srcObject;


            if (!stream) {

                return;
            }


            const tracks =
                stream.getVideoTracks();


            if (!tracks.length) {

                return;
            }


            cameraTrack =
                tracks[0];


            const capabilities =
                cameraTrack.getCapabilities();


            if (
                capabilities.zoom !== undefined
            ) {

                nativeZoomSupported = true;


                console.log(
                    "原生 Zoom 支援範圍：",
                    capabilities.zoom
                );

            } else {

                nativeZoomSupported = false;

                console.log(
                    "使用 CSS Zoom"
                );

            }


            await setCameraZoom(1);


        } catch (error) {

            console.error(
                "Zoom 初始化失敗：",
                error
            );

        }

    }



    // ==========================================
    // Zoom 按鈕
    // ==========================================

    document
        .querySelectorAll(".zoom-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const zoom =
                        Number(
                            button.dataset.zoom
                        );


                    await setCameraZoom(
                        zoom
                    );


                    document
                        .querySelectorAll(
                            ".zoom-button"
                        )
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );

                }
            );

        });



    // ==========================================
    // 設定 Zoom
    // ==========================================

    async function setCameraZoom(
        zoom
    ) {

        currentZoom = zoom;


        const video =
            document.querySelector(
                "#reader video"
            );


        // --------------------------------------
        // 原生相機 Zoom
        // --------------------------------------

        if (
            nativeZoomSupported &&
            cameraTrack
        ) {

            try {

                const capabilities =
                    cameraTrack.getCapabilities();


                const min =
                    capabilities.zoom.min;


                const max =
                    capabilities.zoom.max;


                const target =
                    Math.max(
                        min,
                        Math.min(
                            zoom,
                            max
                        )
                    );


                await cameraTrack.applyConstraints({

                    advanced: [

                        {
                            zoom: target
                        }

                    ]

                });


                console.log(
                    "Camera Zoom:",
                    target
                );


                if (video) {

                    video.classList.remove(
                        "zoom-1",
                        "zoom-2",
                        "zoom-3",
                        "zoom-4",
                        "zoom-5"
                    );

                }


                return;


            } catch (error) {

                console.warn(
                    "原生 Zoom 失敗，使用 CSS Zoom",
                    error
                );

            }

        }


        // --------------------------------------
        // CSS Zoom
        // --------------------------------------

        if (!video) {

            return;
        }


        video.classList.remove(

            "zoom-1",

            "zoom-2",

            "zoom-3",

            "zoom-4",

            "zoom-5"

        );


        if (zoom === 1) {

            video.classList.add(
                "zoom-1"
            );

        }

        else if (zoom === 2) {

            video.classList.add(
                "zoom-2"
            );

        }

        else if (zoom === 3) {

            video.classList.add(
                "zoom-3"
            );

        }

        else if (zoom === 4) {

            video.classList.add(
                "zoom-4"
            );

        }

        else if (zoom === 5) {

            video.classList.add(
                "zoom-5"
            );

        }

    }



    // ==========================================
    // 掃描成功
    // ==========================================

    async function onScanSuccess(
        decodedText
    ) {

        if (scanned) {

            return;
        }


        scanned = true;


        console.log(
            "掃描結果：",
            decodedText
        );


        await stopScanner();


        loading.style.display =
            "block";


        hideMessage();


        newBarcode.value =
            decodedText;


        productBarcode.textContent =
            decodedText;


        await searchProduct(
            decodedText
        );

    }



    // ==========================================
    // 掃描失敗
    // ==========================================

    function onScanFailure(
        error
    ) {

        // 不顯示連續掃描錯誤

    }



    // ==========================================
    // 查詢商品
    // ==========================================

    async function searchProduct(
        barcode
    ) {


        // --------------------------------------
        // 測試模式
        // --------------------------------------

        if (

            !API_URL ||

            API_URL.includes(
                "請把你的 Apps Script 網址"
            )

        ) {


            loading.style.display =
                "none";


            if (
                barcode === "123456789"
            ) {

                showProduct({

                    name: "A商品",

                    barcode: barcode,

                    stock: 10

                });

            }

            else if (
                barcode === "987654321"
            ) {

                showProduct({

                    name: "B商品",

                    barcode: barcode,

                    stock: 25

                });

            }

            else {

                showAddBox(
                    barcode
                );

            }


            return;

        }



        // --------------------------------------
        // Apps Script
        // --------------------------------------

        try {

            const url =

                API_URL +

                "?action=find" +

                "&barcode=" +

                encodeURIComponent(
                    barcode
                );


            const response =
                await fetch(url);


            const data =
                await response.json();


            loading.style.display =
                "none";


            if (
                data.success &&
                data.found
            ) {

                showProduct(
                    data.product
                );

            }

            else {

                showAddBox(
                    barcode
                );

            }


        } catch (error) {

            console.error(error);


            loading.style.display =
                "none";


            showMessage(
                "查詢失敗，請確認 Apps Script 網址是否正確。"
            );


            scanned = false;

        }

    }



    // ==========================================
    // 顯示商品
    // ==========================================

    function showProduct(
        product
    ) {

        resultBox.style.display =
            "block";


        addBox.style.display =
            "none";


        productName.textContent =
            product.name || "-";


        productBarcode.textContent =
            product.barcode || "-";


        productStock.textContent =
            product.stock ?? "-";

    }



    // ==========================================
    // 顯示新增商品
    // ==========================================

    function showAddBox(
        barcode
    ) {

        resultBox.style.display =
            "none";


        addBox.style.display =
            "block";


        newBarcode.value =
            barcode;


        newProductName.value =
            "";


        newStock.value =
            "0";


        setTimeout(
            () => {

                newProductName.focus();

            },
            100
        );

    }



    // ==========================================
    // 新增商品
    // ==========================================

    addButton.addEventListener(
        "click",
        async () => {

            const barcode =
                newBarcode.value.trim();


            const name =
                newProductName.value.trim();


            const stock =
                newStock.value.trim();


            if (!barcode) {

                showMessage(
                    "條碼不能為空。"
                );

                return;
            }


            if (!name) {

                showMessage(
                    "請輸入商品名稱。"
                );

                return;
            }


            loading.textContent =
                "新增商品中...";


            loading.style.display =
                "block";


            hideMessage();



            // ----------------------------------
            // 測試模式
            // ----------------------------------

            if (

                !API_URL ||

                API_URL.includes(
                    "請把你的 Apps Script 網址"
                )

            ) {


                setTimeout(
                    () => {

                        loading.style.display =
                            "none";


                        showProduct({

                            name: name,

                            barcode: barcode,

                            stock:
                                Number(stock) || 0

                        });


                        showMessage(
                            "測試成功：商品已新增。"
                        );


                    },
                    500
                );


                return;

            }



            // ----------------------------------
            // 正式新增
            // ----------------------------------

            try {

                const url =

                    API_URL +

                    "?action=add" +

                    "&barcode=" +

                    encodeURIComponent(
                        barcode
                    ) +

                    "&name=" +

                    encodeURIComponent(
                        name
                    ) +

                    "&stock=" +

                    encodeURIComponent(
                        stock
                    );


                const response =
                    await fetch(url);


                const data =
                    await response.json();


                loading.style.display =
                    "none";


                if (data.success) {

                    showProduct({

                        name: name,

                        barcode: barcode,

                        stock:
                            Number(stock) || 0

                    });


                    showMessage(
                        "商品新增成功。"
                    );

                }

                else {

                    showMessage(

                        data.message ||
                        "新增失敗。"

                    );

                }


            } catch (error) {

                console.error(error);


                loading.style.display =
                    "none";


                showMessage(
                    "新增失敗，請確認 Apps Script。"
                );

            }

        }
    );



    // ==========================================
    // 返回首頁
    // ==========================================

    backButton.addEventListener(
        "click",
        async () => {

            await stopScanner();


            scannerPage.style.display =
                "none";


            homePage.style.display =
                "flex";


            resetResult();

        }
    );



    // ==========================================
    // 停止掃描
    // ==========================================

    async function stopScanner() {

        if (
            html5QrCode &&
            scannerRunning
        ) {

            try {

                await html5QrCode.stop();

                html5QrCode.clear();

            } catch (error) {

                console.error(
                    "停止相機失敗：",
                    error
                );

            }


            scannerRunning =
                false;


            cameraTrack =
                null;


            nativeZoomSupported =
                false;

        }

    // ==========================================
    // 重設
    // ==========================================

    function resetResult() {

        resultBox.style.display =
            "none";


        addBox.style.display =
            "none";


        loading.style.display =
            "none";


        hideMessage();


        productName.textContent =
            "-";


        productBarcode.textContent =
            "-";


        productStock.textContent =
            "-";


        newBarcode.value =
            "";


        newProductName.value =
            "";


        newStock.value =
            "0";


        scanned =
            false;


        currentZoom =
            1;


        /*
         * 重設 Zoom 按鈕
         */

        document
            .querySelectorAll(
                ".zoom-button"
            )
            .forEach(
                button => {

                    button.classList.remove(
                        "active"
                    );


                    if (
                        button.dataset.zoom === "1"
                    ) {

                        button.classList.add(
                            "active"
                        );

                    }

                }
            );

    }



    // ==========================================
    // 訊息
    // ==========================================

    function showMessage(
        text
    ) {

        message.textContent =
            text;


        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";


        message.textContent =
            "";

    }


</script>


</body>

</html>
